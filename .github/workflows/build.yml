name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: https://chca.alwaysdata.net
      MEDIA_ROOT: /tmp/ras-media
      APP_TIME_ZONE: Europe/Paris
      NEXT_PUBLIC_APP_NAME: RAS.
      AUTH_BOOTSTRAP_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare standalone artifact
        run: |
          mkdir -p artifact/.next
          cp -R .next/standalone/. artifact/
          cp -R .next/static artifact/.next/static
          if [ -d public ]; then cp -R public artifact/public; fi

      - name: Create Linux archive
        run: tar -C artifact -czf ras-standalone.tar.gz .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ras-standalone-tar
          path: ras-standalone.tar.gz
          retention-days: 7
