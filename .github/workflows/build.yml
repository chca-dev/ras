name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: https://chca.alwaysdata.net
      MEDIA_ROOT: /tmp/ras-media
      APP_TIME_ZONE: Europe/Paris
      NEXT_PUBLIC_APP_NAME: RAS.
      AUTH_BOOTSTRAP_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare standalone artifact
        run: |
          mkdir -p artifact/.next
          cp -R .next/standalone/. artifact/
          cp -R .next/static artifact/.next/static
          if [ -d public ]; then cp -R public artifact/public; fi
          mkdir -p artifact/node_modules/@swc
          if [ ! -e artifact/node_modules/@swc/helpers ]; then
            ln -s ../.pnpm/node_modules/@swc/helpers artifact/node_modules/@swc/helpers
          fi

      - name: Create Linux archive
        run: tar -C artifact -czf ras-standalone.tar.gz .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ras-standalone-tar
          path: ras-standalone.tar.gz
          retention-days: 7

      - name: Deploy to Alwaysdata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ALWAYSDATA_SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_PRIVATE_KEY }}
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
        run: |
          key_file="$RUNNER_TEMP/ras-deploy-key"
          known_hosts="$RUNNER_TEMP/ras-known-hosts"
          printf '%s\n' "$ALWAYSDATA_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H ssh-chca.alwaysdata.net > "$known_hosts"
          scp \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            ras-standalone.tar.gz \
            chca@ssh-chca.alwaysdata.net:/home/chca/
          ssh \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            chca@ssh-chca.alwaysdata.net \
            'mkdir -p /home/chca/ras-release && tar -xzf /home/chca/ras-standalone.tar.gz --overwrite -C /home/chca/ras-release'
          curl --fail --silent --show-error \
            --request POST \
            --user "$ALWAYSDATA_API_KEY account=chca:" \
            https://api.alwaysdata.com/v1/site/1068446/restart/
